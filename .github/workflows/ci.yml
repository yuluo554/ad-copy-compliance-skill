name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# 同一 ref 的新推送取消上一次未完成的运行（省 runner，且避免旧提交的结论盖住新的）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.8"
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev requirements
        run: python -m pip install -U pip -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests -q
      - name: CLI selftest
        run: python scripts/check.py --selftest
      - name: CLI version
        run: python scripts/check.py --version
